<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <title>System</title>
    <script src="libv86.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: #000; overflow: hidden; overscroll-behavior: none;
        }
        #screen_container { width: 100vw; height: 100vh; display: none; }
        canvas { width: 100% !important; height: 100% !important; object-fit: fill; }

        #menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; z-index: 1000; background: #000;
        }
        button {
            padding: 20px 40px; background: #000; color: #fff;
            border: 1px solid #fff; font-family: monospace; font-size: 1.2rem;
            cursor: pointer; width: 250px;
        }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

<div id="menu">
    <button onclick="startOS('linux.iso')">BOOT LINUX</button>
    <button onclick="startArch()">BOOT ARCH</button>
    <button onclick="startOS('android-x86.iso')">BOOT ANDROID</button>
</div>

<div id="screen_container"></div>

<script>
"use strict";

let emulator = null;

function startOS(isoFile) {
    document.getElementById('menu').style.display = 'none';
    const container = document.getElementById('screen_container');
    container.style.display = 'block';

    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();

    emulator = new V86({
        wasm_path: "v86.wasm",
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: { url: isoFile },
        screen_container: container,
        autostart: true,
        disable_mouse: false,
        disable_keyboard: false
    });
}

function startArch() {
    document.getElementById('menu').style.display = 'none';
    const container = document.getElementById('screen_container');
    container.style.display = 'block';

    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();

    emulator = new V86({
        wasm_path: "v86.wasm",
        memory_size: 512 * 1024 * 1024,
        vga_memory_size: 8 * 1024 * 1024,
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: { 
            url: "https://fastly.mirror.pkgbuild.com/iso/2026.08.01/archlinux-2026.08.01-x86_64.iso" 
        },
        hda: { 
            size: 2 * 1024 * 1024 * 1024, 
            async: true 
        },
        screen_container: container,
        autostart: true,
        disable_mouse: false,
        disable_keyboard: false
    });
}

document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'w') {
        e.preventDefault();
        location.reload(); 
    }
}, true);
</script>
</body>
</html>
