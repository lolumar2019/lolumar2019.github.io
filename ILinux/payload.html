<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #000; overflow: hidden; }
        #screen_container { width: 100vw; height: 100vh; background: #000; }
        #overlay { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(0,0,0,0.8); color: white; display: flex; 
            justify-content: center; align-items: center; cursor: pointer; z-index: 10;
        }
    </style>
    <script src="coi-serviceworker.js"></script>
    <script src="libv86.js"></script>
</head>
<body>

<div id="overlay"><h1>CLICK ME TO PWN!!!!</h1></div>
<div id="screen_container"></div>

<script>
"use strict";

document.getElementById('overlay').addEventListener('click', function() {
    this.style.display = 'none'; // Hide overlay
    
    var emulator = window.emulator = new V86({
        wasm_path: "v86.wasm",
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: { url: "linux.iso" },
        screen_container: document.getElementById("screen_container"),
        autostart: true,
    });
});
</script>
</body>
</html>
