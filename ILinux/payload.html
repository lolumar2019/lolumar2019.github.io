<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <title>System</title>
    <script src="libv86.js"></script>
    <style>
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: #000; overflow: hidden; overscroll-behavior: none;
        }
        #screen_container { width: 100vw; height: 100vh; display: none; }
        canvas { width: 100% !important; height: 100% !important; object-fit: fill; }

        #menu {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            gap: 20px; z-index: 1000; background: #000;
        }
        button {
            padding: 20px 40px; background: #000; color: #fff;
            border: 1px solid #fff; font-family: monospace; font-size: 1.2rem;
            cursor: pointer; width: 250px;
        }
        button:hover { background: #fff; color: #000; }
    </style>
</head>
<body>

<div id="menu">
    <button onclick="startOS('linux.iso')">BOOT LINUX</button>
    <button onclick="startOS('android-x86.iso')">BOOT ANDROID</button>
</div>

<div id="screen_container"></div>

<script>
"use strict";

let emulator = null;

function startOS(isoFile) {
    // Hide menu and show screen
    document.getElementById('menu').style.display = 'none';
    const container = document.getElementById('screen_container');
    container.style.display = 'block';

    // Request full screen for the browser
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();

    // Initialize V86
    emulator = new V86({
        wasm_path: "v86.wasm",
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: { url: isoFile },
        screen_container: container,
        autostart: true,
        disable_mouse: false, // Enabled so you can tap the Android interface
        disable_keyboard: false
    });
}

// Intercept Ctrl+W to "Shutdown"
document.addEventListener('keydown', function(e) {
    if (e.ctrlKey && e.key === 'w') {
        e.preventDefault();
        location.reload(); // Returns to the boot menu
    }
}, true);
</script>
</body>
</html>
