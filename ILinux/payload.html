<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        /* Force black background on everything */
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            background: #000 !important; 
        }
        
        /* Ensure the container is black */
        #screen_container { 
            background: #000 !important; 
        }
    </style>
    <script src="https://copy.sh/v86/build/libv86.js"></script>
</head>
<body>

<script>
"use strict";

window.onload = function()
{
    var emulator = window.emulator = new V86({
        wasm_path: "https://copy.sh/v86/build/v86.wasm",
        memory_size: 32 * 1024 * 1024,
        vga_memory_size: 2 * 1024 * 1024,
        screen_container: document.getElementById("screen_container"),
        bios: {
            url: "https://copy.sh/v86/bios/seabios.bin",
        },
        vga_bios: {
            url: "https://copy.sh/v86/bios/vgabios.bin",
        },
        cdrom: {
            url: "https://copy.sh/v86/images/linux.iso",
        },
        autostart: true,
    });
}
</script>

<!-- Screen container remains the same as the original example -->
<div id="screen_container">
    <div style="white-space: pre; font: 14px monospace; line-height: 14px"></div>
    <canvas style="display: none"></canvas>
</div>

</body>
</html>
