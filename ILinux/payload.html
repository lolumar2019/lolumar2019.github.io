<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ILinux</title>
    <script src="coi-serviceworker.js"></script>
    <script src="libv86.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #fff; overflow: hidden; }
        
        /* Ensure the container is hidden until triggered */
        #screen_container { width: 100vw; height: 100vh; background: #000; display: none; }
        
        #pwn-button {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px; z-index: 9999; cursor: pointer;
        }
    </style>
</head>
<body>

<button id="pwn-button">CLICK ME TO PWN!!!</button>
<div id="screen_container"></div>

<script>
"use strict";

document.getElementById('pwn-button').addEventListener('click', function() {
    // 1. Prepare UI
    document.body.style.backgroundColor = "#000";
    document.getElementById('screen_container').style.display = 'block';
    this.style.display = 'none';

    // 2. Force Fullscreen
    const el = document.documentElement;
    if (el.requestFullscreen) el.requestFullscreen();
    else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();

    // 3. Initialize Emulator
    var emulator = new V86({
        wasm_path: "v86.wasm",
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: { url: "linux.iso" },
        screen_container: document.getElementById("screen_container"),
        autostart: true,
        disable_keyboard: true
    });
});
</script>

</body>
</html>
