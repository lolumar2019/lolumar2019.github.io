<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System</title>
    <script src="coi-serviceworker.js"></script>
    <script src="libv86.js"></script>
</head>
<body>

<button id="pwn-button" style="position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); padding:20px; z-index:999;">CLICK ME TO PWN!!!</button>

<script>
"use strict";

document.getElementById('pwn-button').addEventListener('click', function() {
    console.log("Button clicked! Attempting to start emulator...");
    
    // Check if COOP/COEP headers are active
    if (!window.crossOriginIsolated) {
        console.error("CRITICAL ERROR: Page is not crossOriginIsolated. Emulator cannot start.");
        alert("Error: COOP/COEP headers not active. Please hard-refresh (Ctrl+F5).");
        return;
    }

    try {
        var emulator = new V86({
            wasm_path: "v86.wasm",
            bios: { url: "seabios.bin" },
            vga_bios: { url: "vgabios.bin" },
            cdrom: { url: "linux.iso" },
            screen_container: document.body,
            autostart: true,
            disable_keyboard: true
        });
        console.log("Emulator initialized!");
    } catch (e) {
        console.error("V86 failed to initialize:", e);
    }
});
</script>

</body>
</html>
