<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>System</title>
    <script src="coi-serviceworker.js"></script>
    <script src="libv86.js"></script>
    <style>
        /* Start with white background */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; background: #fff; overflow: hidden; }
        #pwn-button {
            position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            padding: 20px; z-index: 999; cursor: pointer;
        }
    </style>
</head>
<body>

<button id="pwn-button">CLICK ME TO PWN!!!</button>
<div id="screen_container"></div>

<script>
"use strict";

// Cross-browser fullscreen function
function enterFullscreen(element) {
    if (element.requestFullscreen) {
        element.requestFullscreen();
    } else if (element.webkitRequestFullscreen) { /* Safari */
        element.webkitRequestFullscreen();
    } else if (element.msRequestFullscreen) { /* IE11 */
        element.msRequestFullscreen();
    }
}

document.getElementById('pwn-button').addEventListener('click', function() {
    // 1. Force background to black
    document.body.style.backgroundColor = "#000";
    
    // 2. Force Fullscreen on the entire document
    enterFullscreen(document.documentElement);

    // 3. Hide button immediately
    this.style.display = 'none';

    // 4. Initialize Emulator
    var emulator = new V86({
        wasm_path: "v86.wasm",
        bios: { url: "seabios.bin" },
        vga_bios: { url: "vgabios.bin" },
        cdrom: { url: "linux.iso" },
        screen_container: document.getElementById("screen_container"),
        autostart: true,
        disable_keyboard: true
    });
});
</script>

</body>
</html>
